<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- Favicon -->
  <link rel="icon" href="../src/images/favicon.ico" />
  <!-- Font (Pretendard)) -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <!-- Style -->
  <link rel="stylesheet" href="../src/styles/components/global.css">
  <link rel="stylesheet" href="../src/styles/components/form.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8CTG3DWZ9S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-8CTG3DWZ9S');
  </script>
</head>

<body>
  <main>
    <section class="form-section">
      <a class="logo" href="/">
        <img class="logo-img" src="../src/images/form/img_login-logo.svg" alt="판마 마켓 로고 이미지">
      </a>
      <form class="login-form">
        <div class="form-group">
          <!-- Input - Email -->
          <label for="email" class="form-label">이메일</label>
          <input id="email" class="form-input" type="email" name="email" placeholder="이메일을 입력해주세요"
            pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" autocomplete="on" required>
        </div>
        <!-- Input - Nickname -->
        <div class="form-group">
          <label for="nickname" class="form-label">닉네임</label>
          <input id="nickname" class="form-input" type="text" name="nickname" placeholder="닉네임을 입력해주세요" required>
        </div>
        <!-- Input Password -->
        <div class="form-group">
          <label for="password" class="form-label">비밀번호</label>
          <input id="password" class="form-input" type="password" name="password" placeholder="비밀번호를 입력해주세요"
            autocomplete="off" required>
          <img class="visibility-off-img" src="../src/images/form/ic_visibility_off.svg" alt="비밀번호 숨기기 끄기 아이콘 이미지">
        </div>
        <!-- Input Password Confirm -->
        <div class="form-group">
          <label for="password-confirm" class="form-label">비밀번호 확인</label>
          <input id="password-confirm" class="form-input" type="password" name="password-confirm"
            placeholder="비밀번호를 다시 한 번 입력해주세요" autocomplete="off" required>
          <img class="visibility-off-img" src="../src/images/form/ic_visibility_off.svg" alt="비밀번호 숨기기 끄기 아이콘 이미지">
        </div>
        <button class="button-submit" type="submit" disabled>회원가입</button>
        <div class="social-login-group">
          <p class="login-title">간편 로그인하기</p>
          <div class="social-logins">
            <a class="social-login" href="https://www.google.com/">
              <img src="../src/images/form/ic_google-login.svg" alt="구글 소셜 로그인 아이콘 이미지">
            </a>
            <a class="social-login" href="https://www.kakaocorp.com/page/">
              <img src="../src/images/form/ic_kakao-login.svg" alt="카카오톡 소셜 로그인 아이콘 이미지">
            </a>
          </div>
        </div>
        <div class="user-access-section">
          <p class="user-access-title">이미 회원이신가요?</p>
          <a class="button-user-access" href="login.html">로그인</a>
        </div>
      </form>
    </section>
  </main>
</body>

</html>
