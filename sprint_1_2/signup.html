<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./login_signup.css" />
  </head>


  <body>
      <form>
       <div class="form_logo"><a href="/"
        ><img
          src="img/logo_login.png"
          alt="판다마켓 홈"
          width="396"
      /></a>
      </div>
      <label for="username">이메일</label>
      <input id="username" name="emil" type="email" placeholder="이메일을 입력해주세요">
      <label for="nickname">닉네임</label>
      <input id="nickname" name="name" type="text" placeholder="닉네임을 입력해주세요">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요">
      <label for="password-confirm">비밀번호 확인</label>
      <input id="password-confirm" name="password" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
      <button>회원가입</button>
      <div class="e_login">간편 로그인하기
        <div class="e-login-inner">
        <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
          <img src="img/Component 2.png" alt="구글" width="42">
          </a>
          <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer">
          <img src="img/Component 3.png" alt="카카오톡" width="42">
          </a>
          </div>
      </div>
      <div class="page_go">이미 회원이신가요? <a href="login.html"> 로그인</a></div>
  </body>
</html>
