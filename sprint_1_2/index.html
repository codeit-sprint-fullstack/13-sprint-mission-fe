<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./home_style.css" />
  </head>

  <body>
    <!-- header -->
    <header class="header">
      <div class="header_inner">
        <a href="#" class="logo"
          ><img src="img/logo_home.png" alt="판다마켓 로고"
        /></a>
        <a href="login.html" class="login_btn">로그인</a>
      </div>
    </header>

    <!-- main hero -->
    <main class="main">
      <section class="hero_boot_section">
        <!--히어로-->
        <div class="hero_boot_inner">
          <div class="hero_text">
            일상의 모든 물건을 <br />거래해 보세요
            <a href="items.html" class="view_bottn">구경하러 가기</a>
          </div>
          <img class="hero_img" src="img/Img_home_top.png" />
        </div>
      </section>

      <!-- main box -->
      <section id="main_box" class="box_inner">
        <div class="main_box">
          <img src="img/Img_home_01.png" alt="인기 상품" width="50%" />
          <div class="main_box_content">
            <span class="main_box_tag">Hot item</span>
            <h2 class="main_box_title">인기 상품을<br />확인해 보세요</h2>
            <p class="main_box_description">
              가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요
            </p>
          </div>
        </div>

        <div class="main_box">
          <div class="main_box_content">
            <span class="main_box_tag">Search</span>
            <h2 class="main_box_title">구매를 원하는<br />상품을 검색하세요</h2>
            <p class="main_box_description">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </p>
          </div>
          <img src="img/Img_home_02.png" alt="검색 기능" width="50%" />
        </div>

        <div class="main_box">
          <img src="img/Img_home_03.png" alt="판매 상품 등록" width="50%" />
          <div class="main_box_content">
            <span class="main_box_tag">Register</span>
            <h2 class="main_box_title">판매를 원하는<br />상품을 등록하세요</h2>
            <p class="main_box_description">
              어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <!-- main boottom -->
      <section class="hero_boot_section">
        <div class="hero_boot_inner">
          <div class="hero_text">믿을 수 있는 <br />판다마켓 중고거래</div>
          <img class="hero_img" src="img/Img_home_bottom.png" />
        </div>
      </section>
    </main>

    <!-- footer -->
    <footer>
      <div>©codeit - 2024</div>
      <div id="footerbox">
        <a href="privacy.html">Privacy Policy</a>
        <a href="faq.html">FAQ</a>
      </div>
      <div id="social">
        <a
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img src="img/ic_facebook.png" alt="페이스북" width="20"
        /></a>
        <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer"
          ><img src="img/ic_twitter.png" alt="트위터" width="20"
        /></a>
        <a
          href="https://www.youtube.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img src="img/ic_youtube.png" alt="유튜브" width="20"
        /></a>
        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img src="img/ic_instagram.png" alt="인스타그램" width="20"
        /></a>
      </div>
    </footer>
  </body>
</html>
