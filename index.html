<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./reset.css/reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./root.css" />
    <title>판다마켓</title>
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <a href="/index.html" class="header-logo">
          <img
            src="./header-img/header-img.png"
            alt="판다로고"
            class="header-lmg"
          />
          <p class="market-name">판다마켓</p>
        </a>
        <div class="sign-up">
          <a href="/Login/login.html">
            <span class="signup-text">로그인</span>
          </a>
        </div>
      </div>
    </header>

    <div class="main">
      <section class="hero">
        <!-- Hero1 -->
        <div class="hero1">
          <div class="hero1-wrapper">
            <div class="hero1-text">
              <div class="hero1-article">
                일상의 모든 물건을<br />거래해 보세요
              </div>
              <div class="items-link">
                <a href="/items/items.html">
                  <span class="items-link">구경하러 가기</span>
                </a>
              </div>
            </div>
            <div class="hero1-img">
              <img
                src="./hero-img/hero1_panda.png"
                alt="판다"
                class="hero1-img"
              />
            </div>
          </div>
        </div>

        <!-- Hero2 -->
        <div class="hero2">
          <div class="hero2-wrapper">
            <div class="hero2-img">
              <img
                src="./hero-img/hero2-img.png"
                alt="인기상품"
                class="hero2-img"
              />
            </div>
            <div class="hero2-text">
              <p class="hero2-article1">Hot item</p>
              <p class="hero2-article2">인기 상품을<br />확인해 보세요</p>
              <p class="hero2-article3">
                가장 HOT한 중고거래 물품을 <br />판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>

        <!-- Hero3 -->
        <div class="hero3">
          <div class="hero3-wrapper">
            <div class="hero3-text">
              <p class="hero3-article1">Search</p>
              <p class="hero3-article2">구매를 원하는<br />상품을 검색하세요</p>
              <p class="hero3-article3">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
            <div class="hero3-img">
              <img
                src="./hero-img/hero3-img.png"
                alt="검색 이미지"
                class="hero3-img"
              />
            </div>
          </div>
        </div>

        <!-- Hero4 -->
        <div class="hero4">
          <div class="hero4-wrapper">
            <div class="hero4-img">
              <img
                src="./hero-img/hero4-img.png"
                alt="상품등록"
                class="hero4-img"
              />
            </div>
            <div class="hero4-text">
              <p class="hero4-article1">Register</p>
              <p class="hero4-article2">판매를 원하는<br />상품을 등록하세요</p>
              <p class="hero4-article3">
                어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>

        <!-- Hero5 -->
        <div class="hero5">
          <div class="hero5-wrapper">
            <div class="hero5-text">
              <p class="hero5-article">믿을 수 있는<br />판다마켓 중고거래</p>
            </div>
            <div class="hero5-img">
              <img
                src="./hero-img/hero5-img.png"
                alt="중고거래"
                class="hero5-img"
              />
            </div>
          </div>
        </div>
      </section>
    </div>

    <footer class="footer">
      <div class="footer-inner">
        <p class="footer-copy">&copy; codeit - 2024</p>
        <div class="footer-links">
          <div class="privacy">
            <a href="./footer-links/Policy.html" class="privacy"
              >Privacy Policy</a
            >
          </div>
          <div class="faq">
            <a href="./footer-links/FAQ.html" class="faq">FAQ</a>
          </div>
        </div>
        <div class="favicon">
          <div class="facebook">
            <a href="https://www.facebook.com/?locale=ko_KR">
              <img src="./footer-img/ic_facebook.png" alt="Facebook" />
            </a>
          </div>
          <div class="twitter">
            <a href="https://x.com/?lang=ko">
              <img src="./footer-img/ic_twitter.png" alt="Twitter" />
            </a>
          </div>
          <div class="youtube">
            <a href="https://www.youtube.com/">
              <img src="./footer-img/ic_youtube.png" alt="YouTube" />
            </a>
          </div>
          <div class="instagram">
            <a href="https://www.instagram.com/">
              <img src="./footer-img/ic_instagram.png" alt="Instagram" />
            </a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
