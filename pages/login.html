<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="/styles/auth.css" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std.min.css"
    />
  </head>
  <body>
    <main class="auth-container">
      <header class="logo-area">
        <a href="/index.html"
          ><img src="/assets/img/auth_logo.png" alt="판다마켓 로고"
        /></a>
      </header>

      <form class="auth-form">
        <div class="input-group">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="이메일을 입력해주세요" />
        </div>

        <div class="input-group password-field">
          <label for="password">비밀번호</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <button type="button" class="toggle-password">
              <img
                src="/assets/img/btn_visibility_on.png"
                alt="비밀번호 보기"
              />
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit-btn">로그인</button>
      </form>

      <section class="social-section">
        <p>간편 로그인하기</p>
        <div class="social-icons">
          <a href="https://www.google.com/"
            ><img src="/assets/img/ic_google.png" alt="구글 로그인"
          /></a>
          <a href="https://www.kakaocorp.com/page/"
            ><img src="/assets/img/ic_kakao.png" alt="카카오 로그인"
          /></a>
        </div>
      </section>

      <footer class="footer-link">
        판다마켓이 처음이신가요? <a href="/pages/signup.html">회원가입</a>
      </footer>
    </main>
  </body>
</html>
