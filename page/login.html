<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/auth_style.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std.min.css"
    />
  </head>
  <body>
    <section class="login_main">
      <a class="logo" href="../index.html"
        ><img src="../img/logo.png" alt="판다마켓 로고"
      /></a>
      <div class="text_area">
        <div class="input_area">
          <div class="input_box">
            <p>이메일</p>
            <input
              class="input"
              type="email"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <div class="input_box">
            <p>비밀번호</p>
            <div class="password">
              <input
                class="input"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <img src="../img/ic_eyes.svg" alt="눈 아이콘" />
            </div>
          </div>
        </div>
        <button class="login_button">로그인</button>
        <div class="social_login">
          <p>간편 로그인하기</p>
          <div class="icon">
            <a class="ic_cir" href="https://google.com/"
              ><img src="../img/ic_google_cir.png" alt="구글 동그라미 아이콘"
            /></a>
            <a class="ic_cir" href="https://kakaocorp.com/page/"
              ><img src="../img/ic_kakao_cir.png" alt="카카오톡 동그라미 아이콘"
            /></a>
          </div>
        </div>

        <div class="singup">
          판다마켓이 처음이신가요? <a href="./singup.html">회원가입</a>
        </div>
      </div>
    </section>
  </body>
</html>
