<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/main_style.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std.min.css"
    />
  </head>
  <body>
    <header id="header">
      <div class="inner">
        <a class="logo" href="./index.html"
          ><img src="./img/logo.png" alt="판다마켓 로고"
        /></a>
        <a class="login" href="./page/login.html">로그인</a>
      </div>
    </header>
    <main id="main">
      <section class="top-section">
        <div class="top-inner">
          <div class="text-area">
            <div class="text">일상의 모든 물건을<br />거래해 보세요</div>
            <a class="button" href="./page/items.html">구경하러 가기</a>
          </div>
          <img src="./img/Img_home_top.png" alt="판다가 인사하고 있는 그림" />
        </div>
      </section>
      <section class="mid-section">
        <div class="mid-inner">
          <img src="./img/Img_home_01.png" alt="옷을 판매하는 그림" />
          <div class="text-area">
            <div class="textbox">
              <div class="text-deco">Hot item</div>
              <div class="info-text">인기 상품을<br />확인해 보세요</div>
            </div>
            <div class="info-text-1">
              가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
            </div>
          </div>
        </div>
        <div class="mid-inner">
          <div class="text-area">
            <div class="textbox">
              <div class="text-deco">Search</div>
              <div class="info-text">구매를 원하는<br />상품을 검색하세요</div>
            </div>
            <div class="info-text-1">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </div>
          </div>
          <img src="./img/Img_home_02.png" alt="물품을 찾는 그림" />
        </div>
        <div class="mid-inner">
          <img src="./img/Img_home_03.png" alt="물품을 등록하는 그림" />
          <div class="text-area">
            <div class="textbox">
              <div class="text-deco">Register</div>
              <div class="info-text">판매를 원하는<br />상품을 등록하세요</div>
            </div>
            <div class="info-text-1">
              어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
            </div>
          </div>
        </div>
      </section>
      <section class="bot-section">
        <div class="bot-inner">
          <div class="text">믿을 수 있는<br />판다마켓 중고 거래</div>

          <img
            src="./img/Img_home_bottom.png"
            alt="판다가 인사하고 있는 그림"
          />
        </div>
      </section>
    </main>
    <footer id="footer">
      <div class="footer-inner">
        <div class="co-info">©codeit - 2024</div>
        <div class="footer-a">
          <a class="privacy" href="./page/privacy.html">Privacy Policy</a>
          <a class="FAQ" href="./page/faq.html">FAQ</a>
        </div>
        <div class="icon">
          <a href="https://www.facebook.com/"
            ><img src="./img/ic_facebook.svg" alt="페이스북 아이콘"
          /></a>
          <a href="https://x.com/"
            ><img src="./img/ic_twitter.svg" alt="트위터 아이콘"
          /></a>
          <a href="https://www.youtube.com/"
            ><img src="./img/ic_youtube.svg" alt="유튜브 아이콘"
          /></a>
          <a href="https://www.instagram.com/"
            ><img src="./img/ic_instagram.svg" alt="인스타그램 아이콘"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
