<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
  , initial-scale=1.0"
    />
    <link rel="stylesheet" href="./signup.css" />
    <title>회원가입</title>
  </head>
  <body>
    <header class="header">
      <a href="./home.html" class="logo">
        <img src="./images/signuplogo.png" />
      </a>
    </header>
    <main class="all-box">
      <div class="e-mail">이메일</div>
      <input
        class="e-mail-box"
        type="text"
        placeholder="이메일을 입력해주세요"
      />
      <div class="nickname">닉네임</div>
      <input
        class="nickname-box"
        type="text"
        placeholder="닉네임을 입력해주세요"
      />
      <div class="password">비밀번호</div>
      <div class="input-box1">
        <input
          class="password-box"
          type="password"
          placeholder="비밀번호를 입력해주세요"
        />
        <img src="./images/eyesicon.png" class="eye-icon" />
      </div>
      <div class="passwordcheck">비밀번호 확인</div>
      <div class="input-box2">
        <input
          class="passwordcheck-box"
          type="password"
          placeholder="비밀번호를 다시 한 번 입력해주세요"
        />
        <img src="./images/eyesicon.png" class="eye-icon" />
      </div>
      <a href="./login.html" class="signup-button">회원가입</a>
      <div class="box3">
        <h3 class="easy-login">간편로그인하기</h3>

        <a href="https://www.google.com/">
          <img src="./images/goglelogo.png" class="google-icon" />
        </a>
        <a href="https://www.kakaocorp.com/page/">
          <img src="./images/kakaologo.png" class="katalk-icon" />
        </a>
      </div>
      <footer class="box4">
        <span>이미 회원이신가요?</span>
        <a href="./login.html" class="to-login">로그인</a>
      </footer>
    </main>
  </body>
</html>
