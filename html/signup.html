<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/signup.css" />
  </head>
  <body>
    <header>
      <h1>
        <a href="../index.html" class="logo-group">
          <img
            src="../img/login-pandaface.svg"
            alt="판다마켓 로고"
            class="logo-img"
          />
          <span class="logo-text">판다마켓</span>
        </a>
      </h1>
    </header>

    <main>
      <section class="signup">
        <form class="signup-form">
          <div class="input-group">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 입력해주세요"
            />
          </div>

          <div class="input-group">
            <label for="nickname">닉네임</label>
            <input
              type="text"
              id="nickname"
              name="nickname"
              placeholder="닉네임을 입력해주세요"
            />
          </div>

          <div class="input-group">
            <label for="password">비밀번호</label>
            <div class="password-wrap">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <button
                type="button"
                class="toggle-password"
                aria-label="비밀번호 보기"
              >
                <img
                  src="../img/btn_visibility_off_24px.svg"
                  alt="비밀번호 보기"
                />
              </button>
            </div>
          </div>

          <div class="input-group">
            <label for="password-check">비밀번호 확인</label>
            <div class="password-wrap">
              <input
                type="password"
                id="password-check"
                name="password-check"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
              />
              <button
                type="button"
                class="toggle-password"
                aria-label="비밀번호 확인 보기"
              >
                <img src="../img/btn_visibility_off_24px.svg" alt="" />
              </button>
            </div>
          </div>

          <button type="submit" class="signup-btn">회원가입</button>

          <div class="social-login-background">
            <div class="social-login">
              <span class="social-login-text">간편 로그인하기</span>
              <div class="social-icons">
                <a
                  href="https://www.google.com/"
                  class="social-link google-login"
                >
                  <img src="../img/login-google.png" alt="구글 로그인" />
                </a>
                <a
                  href="https://www.kakaocorp.com/page/"
                  class="social-link kakao-login"
                >
                  <img src="../img/login-kakao.png" alt="카카오 로그인" />
                </a>
              </div>
            </div>
          </div>

          <p class="login-link">
            이미 회원이신가요?
            <a href="./login.html" class="login-text">로그인</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
