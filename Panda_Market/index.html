<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
  </head>
  <body>
    <header id="header-background">
      <div class="header-page">
        <div class="title-logo">
          <a href="/index.html" class="logo-link">
            <img src="판다 얼굴.png" alt="마켓 로고" class="market-logo" />
            <span class="logo-text">판다마켓</span>
          </a>
        </div>

        <div class="log-in">
          <a href="/signup.html" target="_blank">
            <img src="./로그인 로고.png" alt="로그인" class="log-in-btn" />
          </a>
        </div>
      </div>
    </header>
    <main>
      <div class="hero">
        <div class="hero1">
          <div class="container1">
            <div class="text-container">
              <div class="container1-text">
                일상의 모든 물건을<br />거래해 보세요
              </div>
              <a href="/items.html" class="goods-link"> 구경하러 가기 </a>
            </div>

            <div class="container1-img">
              <img
                src="./item1_panda.png"
                alt="판다 이미지"
                class="item1-panda"
              />
            </div>
          </div>
        </div>

        <div class="hero2">
          <div class="container2">
            <div class="contatiner2-img">
              <img
                src="./hero2-인기상품.png"
                alt="인기상품"
                class="hot-item img"
              />
            </div>
            <div class="text-container2">
              <p class="hero2-badge">Hot item</p>
              <p class="hero2-article1">
                인기 상품을<br />
                확인해 보세요
              </p>
              <p class="hero2-article2">
                가장 HOT한 중고거래 물품을<br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
        <div class="hero3">
          <div class="container3">
            <div class="text-container3">
              <p class="hero3-badge">Search</p>
              <p class="hero3-article1">
                구매를 원하는<br />
                상품을 검색하세요
              </p>
              <p class="hero3-article2">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
            <div class="hero3-img">
              <img src="./hero3-img.png" alt="검색" class="hero3-img" />
            </div>
          </div>
        </div>
        <div class="hero4">
          <div class="container4">
            <div class="hero4-img">
              <img src="./hero4-img.png" alt=" 상품 등록" class="hero4-img" />
            </div>
            <div class="text-container4">
              <p class="hero4-badge">Register</p>
              <p class="hero4-article1">판매를 원하는<br />상품을 등록하세요</p>
              <p class="hero4-article2">
                어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
        <div class="hero5">
          <div class="container5">
            <div class="text-container5">
              <p class="hero5-article1">
                믿을 수 있는<br />
                판다마켓 중고 거래
              </p>
            </div>
            <div class="hero5-img">
              <img src="./hero5-img.png" alt="중고거래" class="hero5-img" />
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer-background">
      <div class="footer-page">
        <div class="footer-container">
          <div class="footer-text">
            <div class="footer-text">©codeit - 2024</div>
          </div>
          <div class="footer-link">
            <div class="privacy-policybtn">
              <a href="/privacy.html" class="privacy-policy">Privacy Policy </a>
            </div>
            <div class="faq-btn">
              <a href="/faq.html" class="faq-btn">FAQ </a>
            </div>
          </div>
          <div class="footer-favicon">
            <div class="facebook-favicon">
              <a
                href="https://www.facebook.com/?locale=ko_KR"
                target="_blank"
                class="link-facebook"
              >
                <img
                  src="./footer-favicon/ic_facebook.png"
                  alt="facebook"
                  class="facebook-favicon"
              /></a>
            </div>
            <div class="twitter-favicon">
              <a
                href="https://x.com/?lang=ko"
                target="_blank"
                class="link-twitter"
              >
                <img
                  src="./footer-favicon/ic_twitter.png"
                  alt="twitter"
                  class="twitter-favicon"
                />
              </a>
            </div>
            <div class="youtube-favicon">
              <a
                href="https://www.youtube.com/"
                target="_blank"
                class="link-youtube"
              >
                <img
                  src="./footer-favicon/ic_youtube.png"
                  alt="youtube"
                  class="youtube-favicon"
              /></a>
            </div>
            <div class="instagram-favicon">
              <a
                href="https://www.instagram.com"
                target="_blank"
                class="link-instagram"
              >
                <img
                  src="./footer-favicon/ic_instagram.png"
                  alt="instagram"
                  class="instagram-favicon"
              /></a>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
