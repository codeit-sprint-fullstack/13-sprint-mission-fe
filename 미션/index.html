<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- GNB -->
    <header class="gnb">
      <div class="gnb__inner">
        <a href="/" class="gnb__logo">
          <img src="images/logo.svg" class="gnb__logo-icon" />
          판다마켓
        </a>

        <a href="/login">로그인</a>
        <a href="/items" class="'hero__button">구경하러 가기</a>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="hero__inner">
        <div class="hero__content">
          <h1>일상의 모든 물건을<br />거래해 보세요</h1>
          <a href="/items" class="hero__button">구경하러 가기</a>
        </div>

        <div class="hero__image">
          <img src="images/hero.png" alt="판다마켓 메인 이미지" />
        </div>
      </div>
    </section>
    ß
    <!-- FEATURE 1 -->
    <section class="feature">
      <div class="feature__inner">
        <div class="feature__image">
          <img src="images/img_home_01.png" />
        </div>
        <div class="feature__content">
          <span class="feature__label">Hot item</span>
          <h2>인기 상품을<br />확인해 보세요</h2>
          <p>가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요</p>
        </div>
      </div>
    </section>

    <!-- FEATURE 2 -->
    <section class="feature">
      <div class="feature__inner feature--reverse">
        <div class="feature__image">
          <img src="images/img_home_02.png" />
        </div>
        <div class="feature__content">
          <span class="feature__label">Search</span>
          <h2>구매를 원하는<br />상품을 검색해 보세요</h2>
          <p>구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</p>
        </div>
      </div>
    </section>

    <!-- FEATURE 3 -->
    <section class="feature">
      <div class="feature__inner">
        <div class="feature__image">
          <img src="images/img_home_03.png" />
        </div>
        <div class="feature__content">
          <span class="feature__label">Register</span>
          <h2>판매를 원하는<br />상품을 등록해 보세요</h2>
          <p>어떤 상품이든 판매하고 싶은 상품을<br />쉽게 등록해보세요</p>
        </div>
      </div>
    </section>

    <!-- 🔥 하단 2마리 판다 -->
    <section class="bottom-banner">
      <div class="bottom-banner__inner">
        <div class="bottom-banner__content">
          <span class="bottom-banner__label">Marketing</span>
          <h2 class="bottom-banner__title">믿을 수 있는 판다마켓 중고거래</h2>
        </div>

        <div class="bottom-banner__image">
          <img src="images/img_home_04.png" />
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer__inner">
        <p>codeit - 2024</p>
        <div>
          <a href="#">Privacy Policy</a>
          <a href="#">FAQ</a>
        </div>
      </div>
    </footer>
  </body>
</html>
