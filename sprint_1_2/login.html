<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./login_signup.css" />
  </head>
  <body>
    <form>
      <div class="form_logo">
        <a href="/"
          ><img src="img/logo_login.png" alt="판다마켓 홈" width="396"
        /></a>
      </div>
      <label for="username">이메일</label>
      <input
        id="username"
        name="emil"
        type="email"
        placeholder="이메일을 입력해주세요"
      />
      <label for="password">비밀번호</label>
      <div class="input-pw-inner">
        <input
          id="password"
          name="password"
          type="password"
          placeholder="비밀번호를 입력해주세요"
        />
        <button type="button" class="eye-button">
          <img
            src="img/btn_visibility_off.png"
            alt="비밀번호 보기"
            class="eye-icon"
          />
        </button>
      </div>
      <button>로그인</button>
      <div class="e_login">
        간편 로그인하기
        <div class="e-login-inner">
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/Component 2.png" alt="구글" width="42" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="img/Component 3.png" alt="카카오톡" width="42" />
          </a>
        </div>
      </div>
      <div class="page_go">
        판다마켓이 처음이신가요? <a href="signup.html">회원가입</a>
      </div>
    </form>
  </body>
</html>
