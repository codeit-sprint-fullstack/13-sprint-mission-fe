<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./signup.css" />
    <link rel="stylesheet" href="/reset.css/reset.css" />
    <title>판다마켓 회원가입</title>

      <div class="home-wrapper">
        <div class="market-logo">
          <a href="/">
            <img

        </div>
        <div class="logo-text">
          <a href="/" class="logo-text">판다마켓</a>
        </div>

            <li class="email">이메일</li>

          </div>
          <div class="nickname-sec">
            <li class="nickname">닉네임</li>

      <div class="link-out">
        <div class="nav">
          <div class="simple-in">간편 로그인하기</div>
          <div class="favicon">
            <div class="google-fav">
              <a href="https://www.google.com/">
                <img
                  src="/Login/google-favicon.png"
                  alt="google"
                  class="google-fav"
                />
              </a>
            </div>
            <div class="kakao-fav">
              <a href="https://www.kakaocorp.com/page/">
                <img
                  src="/Login/kakao-favicon.png"
                  alt="카카오톡"
                  class="kakao-fav"
                />
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="signup-link">
        <ul class="text-wrapper2">
          <li class="text2">이미 회원이신가요?</li>
          <li class="link-login">
            <a href="/Login/login.html" class="signup-link">로그인</a>

        </ul>
