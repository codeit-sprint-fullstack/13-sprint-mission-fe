<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./login.css" />
    <title>로그인</title>
  </head>
  <body>
    <header class="header">
      <a href="./home.html" class="logo">
        <img src="./사진파일/회원가입 로고.png" />
      </a>
    </header>
    <main class="all-box">
      <div class="e-mail">이메일</div>
      <input
        class="e-mail-box"
        type="text"
        placeholder="이메일을 입력해주세요"
      />
      <div class="password">비밀번호</div>
      <div class="input-box1">
        <input
          class="password-box"
          type="password"
          placeholder="비밀번호를 입력해주세요"
        />
        <img src="./사진파일/눈아이콘.png" class="eye-icon" />
      </div>
      <a href="./login.html" class="login-button">로그인</a>
      <div class="box3">
        <h3 class="easy-login">간편 로그인하기</h3>

        <a href="https://www.google.com/">
          <img src="./사진파일/구글.png" class="google-icon" />
        </a>
        <a href="https://www.kakaocorp.com/page/">
          <img src="./사진파일/카카오톡.png" class="katalk-icon" />
        </a>
      </div>
      <footer class="box4">
        <span>판다마켓이 처음이신가요?</span>
        <a href="./signup.html" class="to-signup">회원가입</a>
      </footer>
    </main>
  </body>
</html>
