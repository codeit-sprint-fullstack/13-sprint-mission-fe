<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-container">
        <a href="./index.html" class="logo-group">
          <img src="./img/판다얼굴.svg" alt="판다마켓 로고" class="logo-img" />
          <span class="logo-text">판다마켓</span>
        </a>

        <a href="./html/login.html" class="login-button">로그인</a>
      </div>
    </header>

    <main class="main-content">
      <section class="hero-section">
        <div class="hero-inner">
          <div class="hero-text">
            <h1 class="hero-title">
              일상의 모든 물건을<br />
              거래해 보세요
            </h1>
            <a href="./html/items.html" class="hero-button">구경하러 가기</a>
          </div>

          <img
            src="./img/Img_home_top.png"
            alt="일상의 모든 물건을 거래해 보세요"
            class="section-image hero-image"
          />
        </div>
      </section>

      <section class="feature-section">
        <div class="feature-inner">
          <a href="./html/hot-item.html">
            <img
              src="./img/main1.png"
              alt="인기 상품을 확인해 보세요"
              class="section-image feature-image-01"
            />
          </a>
        </div>
      </section>

      <section class="feature-section">
        <div class="feature-inner">
          <a href="./html/search.html">
            <img
              src="./img/main2.png"
              alt="구매를 원하는 상품을 검색하세요"
              class="section-image feature-image-02"
            />
          </a>
        </div>
      </section>

      <section class="feature-section">
        <div class="feature-inner">
          <a href="./html/register.html">
            <img
              src="./img/main3.png"
              alt="판매를 원하는 상품을 등록하세요"
              class="section-image feature-image-03"
            />
          </a>
        </div>
      </section>

      <section class="bottom-banner-section">
        <div class="bottom-banner-inner">
          <img
            src="./img/main4.png"
            alt="믿을 수 있는 판다마켓 중고 거래"
            class="section-image bottom-banner-image"
          />
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <p class="footer-copy">@codeit - 2024</p>

        <div class="footer-links">
          <a href="./html/privacy.html">Privacy Policy</a>
          <a href="./html/faq.html">FAQ</a>
        </div>

        <div class="footer-social">
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="페이스북"
          >
            <img src="./img/ic_facebook.svg" alt="페이스북" />
          </a>
          <a
            href="https://twitter.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="트위터"
          >
            <img src="./img/ic_twitter.svg" alt="트위터" />
          </a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="유튜브"
          >
            <img src="./img/ic_youtube.svg" alt="유튜브" />
          </a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="인스타그램"
          >
            <img src="./img/ic_instagram.svg" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
