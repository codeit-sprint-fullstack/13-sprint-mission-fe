<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-std.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo"><img src="assets/img/Group 19.png" /></a>
        <a href="pages/login.html" class="login-btn">로그인</a>
      </div>
    </header>
    <main class="main">
      <section class="hero">
        <div class="hero-inner">
          <div class="hero-text">
            <p>일상의 모든 물건을<br />거래해보세요</p>
            <a href="/pages/item.html" class="go-btn">구경하러 가기</a>
          </div>
          <img src="assets/img/Img_home_top.png" />
        </div>
      </section>
      <section class="feature">
        <div class="feature-item">
          <div class="item-inner">
            <img src="assets/img/Img_home_01.png" />
            <div class="feature-text">
              <span class="feature-tag">Hot Item</span>
              <h2 class="feature-tit">인기 상품을<br />확인해 보세요</h2>
              <p class="feature-dec">
                가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해보세요
              </p>
            </div>
          </div>
        </div>
        <div class="feature-item reverse">
          <div class="item-inner">
            <img src="assets/img/Img_home_02.png" />
            <div class="feature-text">
              <span class="feature-tag">Search</span>
              <h2 class="feature-tit">구매를 원하는<br />상품을 검색하세요</h2>
              <p class="feature-dec">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
          </div>
        </div>
        <div class="feature-item">
          <div class="item-inner">
            <img src="assets/img/Img_home_03.png" />
            <div class="feature-text">
              <span class="feature-tag">Register</span>
              <h2 class="feature-tit">판매를 원하는<br />상품을 등록하세요</h2>
              <p class="feature-dec">
                어떤물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="banner">
        <div class="banner-inner">
          <p class="banner-text">믿을 수 있는<br />판다마켓 중고 거래</p>
          <img src="assets/img/Img_home_bottom.png" />
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <p>&copy;codeit - 2024</p>
        <ul class="footer-links">
          <li><a href="pages/privacy.html">Privacy Policy</a></li>
          <li><a href="pages/faq.html">FAQ</a></li>
        </ul>
        <ul class="footer-sns">
          <li>
            <a
              href="https://www.facebook.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="assets/img/ic_facebook.png" alt="페이스북" />
            </a>
          </li>
          <li>
            <a
              href="https://www.twitter.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="assets/img/ic_twitter.png" alt="트위터" />
            </a>
          </li>
          <li>
            <a
              href="https://www.youtube.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="assets/img/ic_youtube.png" alt="유튜브" />
            </a>
          </li>
          <li>
            <a
              href="https://www.instagram.com"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="assets/img/ic_instagram.png" alt="인스타그램" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
